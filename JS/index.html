<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning DOM</title>
  </head>
  <body>
    <div id="root" class="btn">
      <h1>Helo</h1>
      <button>Submit</button>
    </div>
    <div class="parent">
      <p>First</p>
      <p>Second</p>
      <p>Third</p>
    </div>
    <div id="grandparent">
      <div id="parent">
        <button id="child">Click Me</button>
      </div>
    </div>
    <div class="card">
      <h1 id="title">Clicks: 0</h1>

      <p id="status">Keep clicking</p>

      <span id="count">0</span>

      <div id="progress"></div>
      
      <button id="newBtn">Click</button>
    </div>
    <script src="./DOM.js"></script>
  </body>
</html>
