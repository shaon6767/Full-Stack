<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-emerald-50 text-slate-800">
    <header class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
        <h1 class="text-3xl font-bold tracking-tight">Airbnb</h1>
        <span class="rounded-full border border-white/30 bg-white/10 px-3 py-1 text-sm font-medium">Discover stays</span>
      </div>
    </header>

    <main class="mx-auto flex max-w-6xl flex-col items-center justify-center px-6 py-20 text-center">
      <div class="w-full max-w-3xl rounded-3xl border border-slate-200 bg-white/90 p-10 shadow-xl backdrop-blur-sm">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-emerald-600">Welcome</p>
        <h2 class="text-4xl font-bold text-slate-900 md:text-5xl">Welcome to Airbnb</h2>
        <p class="mt-4 text-lg text-slate-600">
          Find unique homes, welcome new guests, and grow your hosting journey with ease.
        </p>

        <div class="mt-8 flex items-center justify-center">
          <a
            href="/host/add-home"
            class="inline-flex items-center justify-center rounded-xl bg-rose-500 px-6 py-3 text-base font-semibold text-white shadow-lg shadow-rose-200 transition hover:bg-rose-600 focus:outline-none focus:ring-4 focus:ring-rose-200"
          >
            Add Home
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
