<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Home</title>
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-800">
    <div class="mx-auto max-w-2xl">
      <div
        class="rounded-3xl bg-white p-8 shadow-xl ring-1 ring-slate-200 md:p-10"
      >
        <header class="mb-8 text-center">
          <p
            class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-600"
          >
            Host registration
          </p>
          <h1 class="mt-2 text-3xl font-bold text-slate-900">
            Register your home
          </h1>
        </header>

        <form action="/host/add-home" method="POST" class="space-y-6">
          <div>
            <label
              for="name"
              class="mb-2 block text-sm font-medium text-slate-700"
              >Home name</label
            >
            <input
              type="text"
              id="name"
              name="name"
              required
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-base text-slate-900 outline-none transition focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-100"
              placeholder="Enter your property name"
            />
          </div>

          <button
            type="submit"
            class="w-full rounded-xl bg-emerald-600 px-5 py-3 text-base font-semibold text-white shadow-lg shadow-emerald-200 transition hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-200"
          >
            Submit
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
